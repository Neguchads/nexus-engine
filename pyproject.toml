[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-engine"
version = "0.1.0a10"
description = "Provider-independent orchestration engine"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = {file = "LICENSE"}

[project.scripts]
nexus-engine = "nexus_engine.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "CREDITS.md"]

[tool.setuptools.packages.find]
include = ["nexus_engine*"]
