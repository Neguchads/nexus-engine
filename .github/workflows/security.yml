name: Nexus runtime security analysis
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934
        with:
          languages: python
          build-mode: none
          config: |
            paths:
              - nexus_engine
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934
        id: analysis
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/nexus-sarif
      - name: Fail closed on reported runtime findings
        run: python scripts/sarif_gate.py "${{ runner.temp }}/nexus-sarif"
      - name: Preserve analysis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nexus-runtime-sarif
          path: ${{ runner.temp }}/nexus-sarif
          if-no-files-found: error
          retention-days: 30
