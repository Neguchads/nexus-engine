name: Nexus verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m benchmarks.compare
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-index --find-links dist nexus-engine
      - name: Verify installed entry point outside checkout
        shell: bash
        run: |
          repo="$PWD"
          cd "$RUNNER_TEMP"
          python -I -c 'from nexus_engine import __version__; assert __version__ == "0.1.0a6"'
          nexus-engine run "$repo/examples/simple.json"
      - run: nexus-engine run examples/durable.json --db state.db --run-id ci
      - run: nexus-engine run examples/durable.json --db state.db --run-id ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nexus-wheel-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  preview-release:
    needs: verify
    if: github.repository == 'Neguchads/nexus-engine' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: nexus-wheel-ubuntu-latest-3.13
          path: dist-release
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Verify exact preview wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel=dist-release/nexus_engine-0.1.0a6-py3-none-any.whl
          test -f "$wheel"
          test "$(find dist-release -type f -name '*.whl' | wc -l)" -eq 1
          python -m venv "$RUNNER_TEMP/nexus-release-venv"
          "$RUNNER_TEMP/nexus-release-venv/bin/python" -m pip install --no-index --no-deps "$wheel"
          "$RUNNER_TEMP/nexus-release-venv/bin/python" -I -c 'from nexus_engine import __version__; import importlib.metadata as m; assert __version__=="0.1.0a6"; assert not m.requires("nexus-engine")'
          (cd dist-release && sha256sum *.whl > SHA256SUMS)
          printf 'Research preview only. Source commit: %s\nVerification: https://github.com/%s/actions/runs/%s\nNo production certification or NAVI integration. See roadmap and security policy.\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist-release/RELEASE-NOTES.txt
      - name: Publish explicit alpha prerelease without overwriting
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.1.0a6
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Preview already exists; no overwrite"
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Nexus Engine 0.1.0 alpha 6" --notes-file dist-release/RELEASE-NOTES.txt dist-release/*.whl dist-release/SHA256SUMS
