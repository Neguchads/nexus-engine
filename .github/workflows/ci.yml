name: Nexus verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m benchmarks.compare
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-index --find-links dist nexus-engine
      - name: Verify installed entry point outside checkout
        shell: bash
        run: |
          repo="$PWD"
          cd "$RUNNER_TEMP"
          python -I -c 'from nexus_engine import __version__; assert __version__ == "0.1.0a2"'
          nexus-engine run "$repo/examples/simple.json"
      - run: nexus-engine run examples/durable.json --db state.db --run-id ci
      - run: nexus-engine run examples/durable.json --db state.db --run-id ci
